name: Defecto
description: Reportar un defecto encontrado por una prueba
title: "DEF: "
labels: ["defecto"]
body:
  - type: input
    id: prueba
    attributes:
      label: Prueba que lo detectó
      placeholder: tests/integracion/test_filtros.py::test_pendientes_incluye_las_que_estan_en_progreso
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: [Crítica, Alta, Media, Baja]
    validations:
      required: true
