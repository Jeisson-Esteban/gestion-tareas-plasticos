name: Defecto
description: Reportar un defecto encontrado por un caso de prueba
title: "DEF: "
labels: ["tipo:defecto"]
body:
  - type: input
    id: caso
    attributes:
      label: Caso que lo detectó
      placeholder: "CP-06 (tests/integracion/test_filtros.py)"
    validations:
      required: true
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: [Crítica, Alta, Media, Baja]
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
  - type: textarea
    id: obtenido
    attributes:
      label: Resultado obtenido
    validations:
      required: true
