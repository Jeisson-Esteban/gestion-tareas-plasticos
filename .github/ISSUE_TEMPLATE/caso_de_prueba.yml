name: Caso de prueba
description: Registrar un caso de prueba (CP-XX) del plan
title: "CP-XX: "
labels: ["tipo:caso-prueba"]
body:
  - type: input
    id: id
    attributes:
      label: ID
      placeholder: CP-06
    validations:
      required: true
  - type: dropdown
    id: tecnica
    attributes:
      label: Técnica
      options:
        - Valores límite
        - Tabla de decisión
        - Transición de estados
        - Integración
        - Exploratoria / manual
        - Aceptación
    validations:
      required: true
  - type: input
    id: automatizacion
    attributes:
      label: Prueba automatizada
      description: Archivo de pytest que lo cubre, o "manual"
      placeholder: tests/integracion/test_filtros.py
  - type: textarea
    id: precondicion
    attributes:
      label: Precondición
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado
    validations:
      required: true
