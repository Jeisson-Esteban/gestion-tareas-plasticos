name: Caso de prueba
description: Registrar un caso de prueba (CP-XX) del plan
title: "CP-XX: "
labels: ["caso-de-prueba"]
body:
  - type: input
    id: archivo
    attributes:
      label: Archivo de prueba
      placeholder: tests/integracion/test_filtros.py
    validations:
      required: true
  - type: dropdown
    id: nivel
    attributes:
      label: Nivel
      options: [Unitaria, Integración, E2E, Mutación]
    validations:
      required: true
  - type: input
    id: tecnica
    attributes:
      label: Técnica
      placeholder: Valores límite / Transición de estados / Tabla de decisión
  - type: textarea
    id: requisito
    attributes:
      label: Requisito que verifica
    validations:
      required: true
  - type: textarea
    id: criterio
    attributes:
      label: Criterio de aceptación
      description: Qué tiene que pasar para darlo por bueno
    validations:
      required: true
